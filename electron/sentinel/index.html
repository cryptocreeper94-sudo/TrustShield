<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustShield Sentinel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000;
      --surface: #080810;
      --card: #0d0d1a;
      --cyan: #06b6d4;
      --teal: #14b8a6;
      --green: #22c55e;
      --rose: #f43f5e;
      --amber: #f59e0b;
      --t1: #fff;
      --t2: rgba(255,255,255,0.7);
      --t3: rgba(255,255,255,0.35);
      --border: rgba(255,255,255,0.07);
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html, body {
      width: 420px; height: 560px;
      background: transparent;
      font-family: var(--sans);
      color: var(--t1);
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* ── App Shell ── */
    .shell {
      width: 100%; height: 100%;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid rgba(6,182,212,0.15);
      box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(6,182,212,0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Title Bar ── */
    .titlebar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tb-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tb-logo {
      width: 20px; height: 20px;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; font-weight: 900; color: #000;
      flex-shrink: 0;
    }
    .tb-name {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tb-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      -webkit-app-region: no-drag;
    }
    .tb-time {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--t3);
    }
    .tb-close {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--t3);
      font-size: 0.65rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      -webkit-app-region: no-drag;
    }
    .tb-close:hover { background: rgba(244,63,94,0.15); color: var(--rose); border-color: var(--rose); }

    /* ── Shield Core ── */
    .shield-core {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 1.5rem;
      gap: 1.2rem;
      flex-shrink: 0;
    }

    .radar-wrap {
      position: relative;
      width: 140px; height: 140px;
    }

    .radar-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(6,182,212,0.12);
      animation: ring-pulse 3s ease-in-out infinite;
    }
    .radar-ring:nth-child(2) { inset: 12px; animation-delay: 0.5s; border-color: rgba(6,182,212,0.08); }
    .radar-ring:nth-child(3) { inset: 24px; animation-delay: 1s; border-color: rgba(6,182,212,0.05); }

    @keyframes ring-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    .shield-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shield-hex {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 0 30px rgba(6,182,212,0.4), 0 0 60px rgba(6,182,212,0.15);
      animation: shield-glow 3s ease-in-out infinite;
    }

    @keyframes shield-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(6,182,212,0.4), 0 0 60px rgba(6,182,212,0.15); }
      50% { box-shadow: 0 0 40px rgba(6,182,212,0.6), 0 0 80px rgba(6,182,212,0.25); }
    }

    .shield-hex.alert {
      background: linear-gradient(135deg, #f43f5e, #dc2626);
      animation: shield-alert 1s ease-in-out infinite;
      box-shadow: 0 0 30px rgba(244,63,94,0.5), 0 0 60px rgba(244,63,94,0.2);
    }
    @keyframes shield-alert {
      0%, 100% { box-shadow: 0 0 30px rgba(244,63,94,0.5); }
      50% { box-shadow: 0 0 50px rgba(244,63,94,0.8), 0 0 100px rgba(244,63,94,0.3); }
    }

    .status-label {
      text-align: center;
    }
    .status-text {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--green);
      text-shadow: 0 0 20px rgba(34,197,94,0.4);
    }
    .status-text.alert { color: var(--rose); text-shadow: 0 0 20px rgba(244,63,94,0.4); }
    .status-sub {
      font-size: 0.55rem;
      font-family: var(--mono);
      color: var(--t3);
      margin-top: 0.2rem;
      letter-spacing: 0.06em;
    }

    /* ── Metrics Grid ── */
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      padding: 0 1.25rem;
    }
    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.5rem;
      text-align: center;
    }
    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--cyan);
    }
    .metric-label {
      font-size: 0.45rem;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.2rem;
    }

    /* ── Lume-V Status ── */
    .lume-bar {
      margin: 0.75rem 1.25rem 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .lume-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(34,197,94,0.6);
      animation: blink 2s ease infinite;
      flex-shrink: 0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .lume-text {
      font-size: 0.55rem;
      font-family: var(--mono);
      color: var(--t2);
      flex: 1;
    }
    .lume-cert {
      font-size: 0.5rem;
      font-family: var(--mono);
      color: var(--cyan);
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.15);
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
    }

    /* ── Scan Progress ── */
    .scan-bar-wrap {
      margin: 0.75rem 1.25rem 0;
    }
    .scan-bar-track {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .scan-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--teal));
      border-radius: 1px;
      transition: width 0.3s ease;
    }
    .scan-bar-label {
      font-size: 0.48rem;
      font-family: var(--mono);
      color: var(--t3);
      text-align: right;
      margin-top: 0.25rem;
    }

    /* ── Action Buttons ── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      padding: 0.75rem 1.25rem 1.25rem;
      margin-top: auto;
    }
    .btn {
      padding: 0.65rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .btn-scan {
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      color: #000;
      border: none;
      box-shadow: 0 4px 16px rgba(6,182,212,0.25);
    }
    .btn-scan:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(6,182,212,0.35); }
    .btn-scan:active { transform: translateY(0); }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-dashboard {
      background: transparent;
      color: var(--t1);
    }
    .btn-dashboard:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }

    /* ── Footer ── */
    .footer {
      padding: 0 1.25rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-text {
      font-size: 0.45rem;
      font-family: var(--mono);
      color: var(--t3);
    }
    .footer-ver {
      font-size: 0.45rem;
      font-family: var(--mono);
      color: var(--t3);
    }

    /* ── Scanning animation ── */
    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 80%, rgba(6,182,212,0.15) 100%);
      animation: sweep 3s linear infinite;
      display: none;
    }
    .scanning .radar-sweep { display: block; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Title Bar -->
  <div class="titlebar">
    <div class="tb-brand">
      <div class="tb-logo">⛊</div>
      <div class="tb-name">TRUSTSHIELD</div>
    </div>
    <div class="tb-right">
      <div class="tb-time" id="tb-time">--:--</div>
      <button class="tb-close" onclick="window.trustShieldAPI && trustShieldAPI.hideWindow()" title="Hide to tray">✕</button>
    </div>
  </div>

  <!-- Shield Core -->
  <div class="shield-core">
    <div class="radar-wrap" id="radar-wrap">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-sweep" id="radar-sweep"></div>
      <div class="shield-icon">
        <div class="shield-hex" id="shield-hex">⛊</div>
      </div>
    </div>
    <div class="status-label">
      <div class="status-text" id="status-text">PROTECTED</div>
      <div class="status-sub" id="status-sub">Lume-V · All Systems Nominal</div>
    </div>
  </div>

  <!-- Metrics -->
  <div class="metrics">
    <div class="metric-card">
      <div class="metric-val" id="m-hallmarks">—</div>
      <div class="metric-label">Hallmarks</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="m-threat">NONE</div>
      <div class="metric-label">Threat Level</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="m-scan">—</div>
      <div class="metric-label">Last Scan</div>
    </div>
  </div>

  <!-- Lume-V Bar -->
  <div class="lume-bar">
    <div class="lume-dot" id="lume-dot"></div>
    <div class="lume-text" id="lume-text">Lume-V governance layer active · monitor every 30s</div>
    <div class="lume-cert">Lume-V</div>
  </div>

  <!-- Scan Progress -->
  <div class="scan-bar-wrap">
    <div class="scan-bar-track">
      <div class="scan-bar-fill" id="scan-fill"></div>
    </div>
    <div class="scan-bar-label" id="scan-label">Idle</div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-scan" id="scan-btn" onclick="triggerScan()">⟳ Run Scan</button>
    <button class="btn btn-dashboard" onclick="window.trustShieldAPI && trustShieldAPI.openDashboard()">🌐 Dashboard</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">© 2026 DarkWave Studios LLC · Patent Pending</div>
    <div class="footer-ver">v1.0.0</div>
  </div>

</div>

<script>
  // Clock
  function updateClock() {
    const el = document.getElementById('tb-time')
    if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
  }
  updateClock()
  setInterval(updateClock, 30000)

  // Apply status to UI
  function applyStatus(status) {
    const hex = document.getElementById('shield-hex')
    const statusText = document.getElementById('status-text')
    const statusSub = document.getElementById('status-sub')
    const lumeDot = document.getElementById('lume-dot')
    const lumeText = document.getElementById('lume-text')
    const mHallmarks = document.getElementById('m-hallmarks')
    const mThreat = document.getElementById('m-threat')
    const mScan = document.getElementById('m-scan')

    if (status.secure) {
      hex.className = 'shield-hex'
      statusText.className = 'status-text'
      statusText.textContent = 'PROTECTED'
      statusSub.textContent = 'Lume-V · All Systems Nominal'
      lumeDot.style.background = '#22c55e'
      lumeDot.style.boxShadow = '0 0 8px rgba(34,197,94,0.6)'
      lumeText.textContent = 'Lume-V governance layer active · monitor every 30s'
      mThreat.style.color = '#22c55e'
    } else {
      hex.className = 'shield-hex alert'
      statusText.className = 'status-text alert'
      statusText.textContent = 'CHECK REQUIRED'
      statusSub.textContent = 'One or more services need attention'
      lumeDot.style.background = '#f43f5e'
      lumeDot.style.boxShadow = '0 0 8px rgba(244,63,94,0.6)'
      lumeText.textContent = 'Lume-V · Anomaly detected in health check'
      mThreat.style.color = '#f43f5e'
    }

    mHallmarks.textContent = status.hallmarksVerified ?? '—'
    mThreat.textContent = status.threatLevel || 'NONE'
    if (status.lastScan) {
      mScan.textContent = new Date(status.lastScan).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
    }
  }

  // Manual scan
  let scanning = false
  async function triggerScan() {
    if (scanning) return
    scanning = true
    const btn = document.getElementById('scan-btn')
    const fill = document.getElementById('scan-fill')
    const label = document.getElementById('scan-label')
    const sweep = document.getElementById('radar-sweep')

    btn.disabled = true
    btn.textContent = '⟳ Scanning...'
    sweep.style.display = 'block'
    label.textContent = 'Scanning...'

    // Animate bar
    let pct = 0
    const barInterval = setInterval(() => {
      pct = Math.min(pct + 3, 90)
      fill.style.width = pct + '%'
    }, 80)

    if (window.trustShieldAPI) {
      const status = await trustShieldAPI.triggerScan()
      applyStatus(status)
    }

    clearInterval(barInterval)
    fill.style.width = '100%'
    label.textContent = 'Scan complete'

    setTimeout(() => {
      fill.style.width = '0%'
      label.textContent = 'Idle'
      btn.disabled = false
      btn.innerHTML = '⟳ Run Scan'
      sweep.style.display = 'none'
      scanning = false
    }, 1500)
  }

  // Load initial status
  async function init() {
    if (window.trustShieldAPI) {
      const status = await trustShieldAPI.getStatus()
      applyStatus(status)

      // Listen for background updates
      trustShieldAPI.onStatusUpdate((status) => applyStatus(status))
    }
  }

  document.addEventListener('DOMContentLoaded', init)
</script>
</body>
</html>
